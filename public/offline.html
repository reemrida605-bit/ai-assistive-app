<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>لا يوجد اتصال — المساعد البصري</title>
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef2f5;
        color: #0f172a;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 32px 24px;
        background: #fff;
        border: 2px solid #cbd5e1;
        border-radius: 16px;
      }
      h1 { margin: 0 0 12px; font-size: 1.4rem; }
      p  { margin: 0 0 24px; line-height: 1.6; }
      button {
        width: 100%;
        min-height: 56px;
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: #2563eb;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تحليل الصور يحتاج اتصالاً بالإنترنت. تأكد من الاتصال ثم حاول مرة أخرى.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
